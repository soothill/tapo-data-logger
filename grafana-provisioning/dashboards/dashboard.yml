# Grafana dashboard provisioning
# This file automatically loads dashboards into Grafana

apiVersion: 1

providers:
  - name: 'Tapo Energy Monitoring'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
