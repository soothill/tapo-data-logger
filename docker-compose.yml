# All-in-one Docker Compose setup for tapo-data-logger with InfluxDB and Grafana
# This configuration includes everything needed to run the complete stack

version: '3.8'

services:
  # InfluxDB time-series database
  influxdb:
    image: influxdb:2.7
    container_name: tapo-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      # Initial setup - change these values!
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword123
      - DOCKER_INFLUXDB_INIT_ORG=my-org
      - DOCKER_INFLUXDB_INIT_BUCKET=tapo_energy
      - DOCKER_INFLUXDB_INIT_RETENTION=0  # infinite retention
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - tapo-network

  # Grafana visualization and dashboarding
  grafana:
    image: grafana/grafana:10.2.3
    container_name: tapo-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboard.json:/etc/grafana/provisioning/dashboards/tapo-dashboard.json:ro
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_ANALYTICS_REPORTING_ENABLED=false
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - tapo-network

  # Tapo Data Logger application
  tapo-logger:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tapo-data-logger
    restart: unless-stopped
    ports:
      - "8080:8080"  # Web UI
    volumes:
      - ./config.json:/app/config.json:ro
    environment:
      - TZ=UTC
      - CONFIG_FILE=/app/config.json
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - tapo-network
    # Optional: Run with limited privileges
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Optional: Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

networks:
  tapo-network:
    driver: bridge

volumes:
  influxdb-data:
    driver: local
  influxdb-config:
    driver: local
  grafana-data:
    driver: local
